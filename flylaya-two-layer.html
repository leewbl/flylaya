<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果蝇在 Minecraft 世界 · Laya + 果蝇大脑双层控制</title>
<style>
  html,body{margin:0;background:#14171f;color:#e8eaf0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
  .frame{max-width:1280px;margin:18px auto;padding:0 12px}
  svg{width:100%;height:auto;display:block;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
  .caption{padding:12px 6px;font-size:15px;line-height:1.7;color:#c8cedb}
  .caption b{color:#8fc7ff}
  .flow{stroke-dasharray:10 8;animation:march 1.1s linear infinite}
  @keyframes march{to{stroke-dashoffset:-36}}
  .node{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
  .halo{paint-order:stroke;stroke:#10131a;stroke-width:4px;stroke-linejoin:round}
  .chip{transition:fill .25s}
</style>
</head>
<body>
<div class="frame">
<svg id="scene" viewBox="0 0 1280 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6db9ff"/><stop offset="1" stop-color="#cfeaff"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- 天空 / 太阳 / 云 -->
  <rect width="1280" height="760" fill="url(#sky)"/>
  <g id="sun">
    <rect x="1030" y="60" width="88" height="88" fill="#ffd94d" stroke="#e6b422" stroke-width="4"/>
    <rect x="1022" y="52" width="104" height="104" fill="none" stroke="#ffe98a" stroke-width="3" opacity=".6"/>
    <g fill="#ffe98a">
      <rect x="1070" y="24" width="12" height="12"/><rect x="1070" y="172" width="12" height="12"/>
      <rect x="994" y="98" width="12" height="12"/><rect x="1146" y="98" width="12" height="12"/>
    </g>
  </g>
  <g fill="#ffffff" opacity=".92">
    <g><rect x="120" y="90" width="120" height="26"/><rect x="146" y="64" width="70" height="26"/></g>
    <g><rect x="420" y="140" width="150" height="26"/><rect x="452" y="114" width="80" height="26"/></g>
    <g><rect x="820" y="70" width="110" height="26"/><rect x="846" y="44" width="60" height="26"/></g>
  </g>

  <!-- 地形与树由脚本生成 -->
  <g id="terrain"></g>
  <g id="trees"></g>

  <!-- 果蝇影子 -->
  <ellipse id="shadow" cx="0" cy="0" rx="26" ry="7" fill="#0a2a0a" opacity=".22"/>

  <!-- 果蝇本体：外层组只做平移，姿态（旋转/镜像）作用于 flyBody，防止意图标签跟着翻转 -->
  <g id="fly">
    <g id="flyBody">
      <g id="wingBack"><ellipse cx="16" cy="-4" rx="20" ry="6" fill="#dfe9ff" opacity=".45" stroke="#9aa8c4" stroke-width="1"/></g>
      <line x1="-26" y1="6" x2="-38" y2="16" stroke="#3a3a42" stroke-width="2"/>
      <line x1="-18" y1="8" x2="-24" y2="20" stroke="#3a3a42" stroke-width="2"/>
      <line x1="-10" y1="8" x2="-4" y2="20" stroke="#3a3a42" stroke-width="2"/>
      <ellipse cx="8" cy="0" rx="24" ry="12" fill="#4a4a54" stroke="#2e2e36" stroke-width="2"/>
      <path d="M4,-11 h5 v22 h-5 z M14,-11.5 h5 v23 h-5 z M24,-10 h4.5 v20 h-4.5 z" fill="#2e2e36" opacity=".8"/>
      <ellipse cx="-18" cy="0" rx="15" ry="10" fill="#5a5a66" stroke="#2e2e36" stroke-width="2"/>
      <circle cx="-38" cy="-2" r="9" fill="#4a4a54" stroke="#2e2e36" stroke-width="2"/>
      <ellipse cx="-36" cy="-5" rx="7" ry="8" fill="#c03030"/>
      <circle cx="-38" cy="-7" r="2" fill="#ff9090"/>
      <g id="wingFront"><ellipse cx="16" cy="-6" rx="22" ry="7" fill="#ffffff" opacity=".55" stroke="#9aa8c4" stroke-width="1.5"/></g>
      <path d="M-45,-6 q-8,-6 -14,-4 M-45,-3 q-9,-1 -15,4" stroke="#2e2e36" stroke-width="1.5" fill="none"/>
    </g>
    <text id="intentTag" class="halo" x="0" y="-52" font-size="17" font-weight="700" fill="#ffd166" text-anchor="middle">意图：探索巡航</text>
  </g>

  <!-- ============ 控制系统面板 ============ -->
  <!-- Laya 决策层 -->
  <g id="panelLaya">
    <rect x="36" y="30" width="308" height="188" rx="12" fill="#0f121acc" stroke="#3b4354" stroke-width="2"/>
    <text x="56" y="60" font-size="19" font-weight="800" fill="#8fc7ff">Laya · 决策层（想干什么）</text>
    <text x="56" y="80" font-size="12" fill="#9aa3b5">语言决策模型 · 每 0.3 秒读一次状态文字</text>
    <g id="chips"></g>
    <text x="56" y="176" font-size="12" fill="#9aa3b5">唤醒度 arousal</text>
    <rect x="140" y="166" width="180" height="12" rx="6" fill="#232838"/>
    <rect id="arousal" x="140" y="166" width="90" height="12" rx="6" fill="#ffb35c"/>
  </g>

  <!-- 果蝇大脑执行层 -->
  <g id="panelBrain">
    <rect x="392" y="30" width="330" height="188" rx="12" fill="#0f121acc" stroke="#3b4354" stroke-width="2"/>
    <text x="412" y="60" font-size="19" font-weight="800" fill="#9fe870">果蝇大脑 · 执行层（怎么飞）</text>
    <text x="412" y="80" font-size="12" fill="#9aa3b5">全脑接线图仿真 · 166,700 神经元</text>
    <g id="net"></g>
    <text x="412" y="176" font-size="12" fill="#9aa3b5">DN 读出</text>
    <rect x="470" y="166" width="110" height="7" fill="#232838"/><rect id="dnL" x="470" y="166" width="50" height="7" fill="#7fd1ff"/>
    <text x="586" y="176" font-size="11" fill="#9aa3b5">左</text>
    <rect x="606" y="166" width="110" height="7" fill="#232838"/><rect id="dnR" x="606" y="166" width="50" height="7" fill="#ff9f6e"/>
    <text x="722" y="176" font-size="11" fill="#9aa3b5">右</text>
  </g>

  <!-- 信号流箭头（路径每帧跟随果蝇重算） -->
  <g fill="none" stroke-width="3.5" marker-end="url(#arr)">
    <path id="aState" class="flow" stroke="#ffd166" d="M 560 330 C 420 260, 300 300, 190 224"/>
    <path id="aIntent" class="flow" stroke="#7fd1ff" d="M 348 124 L 388 124"/>
    <path id="aMotor" class="flow" stroke="#ff9f6e" d="M 560 224 C 600 300, 660 330, 700 380"/>
    <path id="aSense" class="flow" stroke="#9fe870" d="M 800 380 C 760 300, 730 270, 700 226"/>
  </g>
  <g font-size="13" font-weight="700">
    <text class="halo" x="286" y="266" fill="#ffd166">状态文字（亮度摘要·速度·意图史）</text>
    <text class="halo" x="352" y="112" fill="#7fd1ff">意图→增益</text>
    <text class="halo" x="612" y="316" fill="#ff9f6e">下行神经元→偏航·推力</text>
    <text class="halo" x="748" y="300" fill="#9fe870">视网膜亮度</text>
  </g>

  <!-- 图例 -->
  <g id="legend">
    <rect x="36" y="618" width="330" height="116" rx="10" fill="#0f121acc" stroke="#3b4354" stroke-width="2"/>
    <text x="54" y="644" font-size="15" font-weight="800" fill="#e8eaf0">一句话分工</text>
    <text x="54" y="668" font-size="13" fill="#8fc7ff">Laya 决定往哪去：选意图、调增益、给唤醒度</text>
    <text x="54" y="690" font-size="13" fill="#9fe870">果蝇大脑决定怎么飞：亮度→网络→DN→转向</text>
    <text x="54" y="716" font-size="12" fill="#9aa3b5">意图每 7 秒切换（演示放慢）；真实系统约 2 秒一换</text>
  </g>
</svg>
<div class="caption">
  <b>两层系统</b>：果蝇每时每刻把画面变成左右眼亮度信号送进大脑仿真（<b>执行层</b>，166,700 个神经元照真实接线图连接），读出下行神经元的左右差换算成偏航和推力；与此同时，状态文字每 0.3 秒发给 <b>Laya（决策层）</b>，它从趋光、避障优先、探索巡航、边界规避、悬停休息五个意图里选一个并输出唤醒度，按意图调整感官与运动增益。图中箭头颜色对应四条信号：黄=状态文字、蓝=意图增益、橙=运动指令、绿=视网膜亮度。
</div>
</div>

<script>
/* ---------- 基础 ---------- */
const NS = "http://www.w3.org/2000/svg";
const B = 40;                 // 方块边长
const intents = ["趋光","避障优先","探索巡航","边界规避","悬停休息"];
const el = id => document.getElementById(id);
function mk(tag, attrs, parent){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
const rnd = (i,j) => ((i*73856093 ^ j*19349663) >>> 0) / 4294967295;  // 确定性伪随机，纹理用

/* ---------- 地形高度表（列顶的 y 坐标） ---------- */
function colTop(i){            // i: 0..32，x = i*40
  const x = i * B;
  if (x >= 1040) return 640;                       // 水域
  if (x < 520)  return 560;                        // 平原
  const t = (x - 520) / 520;                       // 山体：520→1040
  const bell = Math.sin(Math.PI * t);              // 0→1→0
  return 560 - 300 * Math.pow(bell, .8);
}
function groundY(x){          // 任意 x 处地表 y（插值）
  const i = Math.max(0, Math.min(32, x / B));
  const i0 = Math.floor(i), f = i - i0;
  return colTop(i0) * (1 - f) + colTop(Math.min(32, i0 + 1)) * f;
}

/* ---------- 画地形 ---------- */
(function terrain(){
  const g = el("terrain");
  for (let i = 0; i <= 32; i++){
    const top = colTop(i), x = i * B;
    const water = top >= 640;
    for (let y = top, d = 0; y < 760; y += B, d++){
      let fill, stroke;
      if (water){
        fill = y === 640 ? "#4a86c8" : "#3a6ea5"; stroke = "#2e5a8c";
      } else if (d === 0 && top <= 320){
        fill = "#f4f8ff"; stroke = "#c9d6e8";      // 山顶积雪
      } else if (d === 0){
        fill = "#6abe30"; stroke = "#4e9422";      // 草方块
      } else if (d < 3){
        fill = "#8b5a2b"; stroke = "#6d431d";      // 泥土
      } else {
        fill = "#8a8a8f"; stroke = "#6e6e73";      // 石头
      }
      mk("rect", {x, y, width:B, height:B, fill, stroke, "stroke-width":2}, g);
      if (!water){
        const n = 1 + Math.floor(rnd(i, d) * 2);   // 像素纹理
        for (let k = 0; k < n; k++){
          const px = x + 6 + rnd(i * 3 + k, d) * 24, py = y + 6 + rnd(i, d * 3 + k) * 24;
          mk("rect", {x:px, y:py, width:8, height:8, fill:"#000", opacity:.08}, g);
        }
      }
    }
    if (water){ mk("rect", {x, y:640, width:B, height:6, fill:"#7db4e8", opacity:.8}, g); }
    else if (top > 320){ mk("rect", {x, y:top, width:B, height:6, fill:"#8fe050", opacity:.9}, g); }
  }
})();

/* ---------- 树（两棵，平原上） ---------- */
(function trees(){
  const g = el("trees");
  [160, 432].forEach(tx => {
    const ty = groundY(tx);
    for (let k = 1; k <= 3; k++)
      mk("rect", {x:tx - 8, y:ty - k * B, width:16, height:B - 2, fill:"#6b4a2a", stroke:"#4e3418", "stroke-width":2}, g);
    const cy = ty - 3 * B - 52;
    for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++){
      const lx = tx - 14 + c * 26, ly = cy - 26 + r * 26;
      mk("rect", {x:lx, y:ly, width:26, height:26, fill:(c+r)%2 ? "#3e8e2f" : "#2f7a24", stroke:"#256119", "stroke-width":2}, g);
    }
  });
})();

/* ---------- Laya 面板：意图芯片 ---------- */
(function chips(){
  const g = el("chips");
  intents.forEach((name, i) => {
    const x = 56, y = 94 + i * 15;
    mk("rect", {x, y, width:130, height:13, rx:6, class:"chip", id:"chip" + i}, g);
    const t = mk("text", {x: x + 10, y: y + 10.5, "font-size":11, id:"chipt" + i, fill:"#9aa3b5"}, g);
    t.textContent = name;
  });
})();
function setChip(active){
  intents.forEach((_, i) => {
    const on = i === active;
    el("chip" + i).setAttribute("fill", on ? "#2f6fdb" : "#232838");
    el("chip" + i).setAttribute("stroke", on ? "#7fb0ff" : "none");
    el("chipt" + i).setAttribute("fill", on ? "#ffffff" : "#9aa3b5");
  });
}

/* ---------- 大脑面板：迷你网络（视网膜→连接组→DN） ---------- */
(function net(){
  const g = el("net");
  const retina = [], brain = [], dn = [];
  for (let i = 0; i < 5; i++)  retina.push([424, 108 + i * 14]);
  for (let i = 0; i < 8; i++)  brain.push([512, 100 + i * 11 + (i % 2) * 4]);
  dn.push([596, 118]); dn.push([596, 146]);
  const edges = [];
  retina.forEach((r, i) => { for (let k = 0; k < 2; k++) edges.push([r, brain[(i * 2 + k) % 8]]); });
  brain.forEach((b, i) => edges.push([b, dn[i % 2]]));
  edges.forEach(([a, b]) => mk("line", {x1:a[0], y1:a[1], x2:b[0], y2:b[1], stroke:"#465068", "stroke-width":1}, g));
  const dot = (p, c, delay) => mk("circle", {cx:p[0], cy:p[1], r:4, fill:c, class:"node"}, g)
    .setAttribute("style", `animation-delay:${delay}s`);
  retina.forEach((p, i) => dot(p, "#9fe870", i * .12));
  brain.forEach((p, i)  => dot(p, "#c9d3e8", .3 + i * .09));
  dn.forEach((p, i)     => dot(p, i ? "#ff9f6e" : "#7fd1ff", .8));
  mk("text", {x:404, y:104, "font-size":10, fill:"#9fe870"}, g).textContent = "视网膜";
  mk("text", {x:494, y:94,  "font-size":10, fill:"#c9d3e8"}, g).textContent = "连接组";
  mk("text", {x:584, y:168, "font-size":10, fill:"#ff9f6e"}, g).textContent = "DN";
})();

/* ---------- 双层控制模拟 ---------- */
const sunPos = {x: 1074, y: 104};
const anchors = {        // 每个意图的巡锚点与半径
  "趋光":     {x: 950, y: 210, r: 70,  w: 1.1},
  "避障优先": {x: 300, y: 300, r: 90,  w: 1.4},
  "探索巡航": {x: 620, y: 250, r: 250, w: .55},
  "边界规避": {x: 640, y: 320, r: 90,  w: 1.6},
  "悬停休息": {x: 0,   y: 0,   r: 26,  w: .8},   // 锚点在切换时取当时位置
};
let intentIdx = 2, intentT = 0, hold = null;
const fly = {x: 300, y: 280, vx: 40, vy: 0};
let facing = 1;        // 1=向右飞（精灵水平镜像），-1=向左飞（原始朝向）
let t = 0, last = performance.now();

function pickTarget(name){
  const a = anchors[name];
  const ax = name === "悬停休息" ? hold.x : a.x;
  const ay = name === "悬停休息" ? hold.y : a.y;
  const tx = ax + a.r * Math.cos(t * a.w);
  const ty = ay + a.r * .6 * Math.sin(t * a.w * 1.3);
  return {x: Math.max(60, Math.min(1220, tx)), y: Math.max(150, Math.min(600, ty))};
}

/* 果蝇端的箭头挂点：头部（视网膜亮度出）、尾背（状态文字出）、背上（运动指令入） */
function attachPoints(){
  const hx = fly.x + (facing === 1 ? 44 : -50), hy = fly.y - 6;
  const sx = fly.x + (facing === 1 ? -40 : 34), sy = fly.y - 26;
  const mx = fly.x - 6, my = fly.y - 20;
  return {hx, hy, sx, sy, mx, my};
}

function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now; t += dt;
  // 意图切换（演示 7 秒一轮换；真实系统实测约每 2 秒换一次目标，0.5Hz）
  intentT += dt;
  if (intentT > 7){
    intentT = 0;                                   // 计时器复位：否则第 7 秒后每帧狂切
    intentIdx = (intentIdx + 1) % intents.length;
    const name = intents[intentIdx];
    if (name === "悬停休息") hold = {x: fly.x, y: fly.y};
    setChip(intentIdx);
    el("intentTag").textContent = "意图：" + name;
  }
  // 决策层输出目标 → 执行层（转向+推进）跟踪
  const name = intents[intentIdx];
  const tgt = pickTarget(name);
  fly.vx += (tgt.x - fly.x) * 1.6 * dt;
  fly.vy += (tgt.y - fly.y) * 1.6 * dt;
  const damp = Math.pow(.35, dt);
  fly.vx *= damp; fly.vy *= damp;
  const sp = Math.hypot(fly.vx, fly.vy), maxSp = name === "悬停休息" ? 60 : 260;
  if (sp > maxSp){ fly.vx *= maxSp / sp; fly.vy *= maxSp / sp; }
  fly.x += fly.vx * dt; fly.y += fly.vy * dt;
  // 地形防穿：保持在地表上方 70px（水面可低飞）
  const gy = groundY(fly.x) + (groundY(fly.x) > 620 ? -30 : -70);
  if (fly.y > gy){ fly.y = gy; fly.vy = Math.min(fly.vy, 0); }
  fly.y = Math.max(140, fly.y); fly.x = Math.max(50, Math.min(1230, fly.x));

  /* 姿态：向右飞时水平镜像精灵，俯仰限 ±55°——任意航向都保持正立，不会 180° 倒挂。
     换向加迟滞（水平速度分量超过 ±45 才翻转），悬停小幅摆动时不会来回抖。 */
  if (fly.vx > 45) facing = 1; else if (fly.vx < -45) facing = -1;
  let pitch = facing === 1
    ? Math.atan2(fly.vy, fly.vx) * 180 / Math.PI
    : -Math.atan2(fly.vy, -fly.vx) * 180 / Math.PI;
  pitch = Math.max(-55, Math.min(55, pitch));
  el("fly").setAttribute("transform", `translate(${fly.x.toFixed(1)},${fly.y.toFixed(1)})`);
  el("flyBody").setAttribute("transform",
    facing === 1 ? `rotate(${pitch.toFixed(1)}) scale(-1,1)` : `rotate(${pitch.toFixed(1)})`);

  // 振翅（21Hz 抖动）
  const flap = 28 * Math.sin(t * 2 * Math.PI * 21);
  el("wingFront").setAttribute("transform", `rotate(${(-flap).toFixed(1)} -12 -6)`);
  el("wingBack").setAttribute("transform", `rotate(${(-flap * .8 + 18).toFixed(1)} -10 -4)`);

  // 影子
  const alt = Math.max(0, Math.min(1, (groundY(fly.x) - fly.y) / 320));
  el("shadow").setAttribute("cx", fly.x);
  el("shadow").setAttribute("cy", groundY(fly.x) - 4);
  el("shadow").setAttribute("rx", 10 + 20 * alt);
  el("shadow").setAttribute("opacity", (.05 + .2 * alt).toFixed(2));

  // 仪表：唤醒度随机游走，DN 随转向摆动
  el("arousal").setAttribute("width", (90 + 40 * Math.sin(t * .8) + 20 * Math.sin(t * 2.3) + 30).toFixed(0));
  const turn = fly.vx / Math.max(60, sp);
  el("dnL").setAttribute("width", (55 + 45 * turn).toFixed(0));
  el("dnR").setAttribute("width", (55 - 45 * turn).toFixed(0));

  /* 信号箭头：面板端固定，果蝇端每帧跟随，果蝇飞走后箭头不再指向空位 */
  const {hx, hy, sx, sy, mx, my} = attachPoints();
  const cClamp = v => Math.max(60, Math.min(1240, v));
  el("aState").setAttribute("d",
    `M ${sx.toFixed(0)} ${sy.toFixed(0)} C ${cClamp(fly.x - 100).toFixed(0)} ${(fly.y - 140).toFixed(0)}, 330 330, 192 222`);
  el("aMotor").setAttribute("d",
    `M 560 222 C 610 320, ${cClamp(fly.x + 30).toFixed(0)} ${(fly.y - 90).toFixed(0)}, ${mx.toFixed(0)} ${my.toFixed(0)}`);
  el("aSense").setAttribute("d",
    `M ${hx.toFixed(0)} ${hy.toFixed(0)} C ${cClamp(hx + 80).toFixed(0)} ${(fly.y - 130).toFixed(0)}, 770 310, 698 222`);

  requestAnimationFrame(frame);
}
setChip(intentIdx);
el("intentTag").textContent = "意图：" + intents[intentIdx];
requestAnimationFrame(frame);
</script>
</body>
</html>
