<figcaption>
  <b>图 1 | FlyLaya 双层系统与 H1 趋光假设检验。</b>
  <b class="pan">a</b>，闭环架构：3D 世界渲染成视网膜亮度向量送入果蝇连接组仿真（166,700 神经元），下行神经元（DN）左右读出经运动映射更新位姿；Laya 决策层每 0.3 秒读状态文字（observable_state），输出五选一意图与唤醒度，经感官（sensory，主条件）、运动（motor）两条通路调增益，直接偏航（direct）在机制实验中默认关闭。
  <b class="pan">b</b>，对照设计：P_yoked 回放录自 P_laya 的意图序列并用块置换打乱「序列—状态」对应，保留意图占比、停留与唤醒度；P_rule 用几何/感官规则校验仪器可表达性。
  <b class="pan">c</b>，H1 结果（S1 单侧光源，双镜像）：段级配对差左镜 −0.004、右镜 −0.016，95% 置信区间跨零，远低于预注册阈值 +0.15；规则对照 P_rule 绝对得分 0.55–0.63 证明仪器可表达目标行为，S4 开放场景 holdout 复现 P_laya ≈ P_yoked。结论：断点位于决策层的状态语义，不在接口。
</figcaption>

<script>
const svgEl = document.getElementById("fig");
function serializeSVG(){
  const clone = svgEl.cloneNode(true);
  clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
  return new XMLSerializer().serializeToString(clone);
}
function saveBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function dlSVG(){
  saveBlob(new Blob([serializeSVG()], { type: "image/svg+xml;charset=utf-8" }), "flylaya-fig1.svg");
}
function dlPNG(){
  const img = new Image();
  const url = URL.createObjectURL(new Blob([serializeSVG()], { type: "image/svg+xml;charset=utf-8" }));
  img.onload = () => {
    const k = 3, c = document.createElement("canvas");
    c.width = 1240 * k; c.height = 600 * k;
    const ctx = c.getContext("2d");
    ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, c.width, c.height);
    ctx.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => { saveBlob(b, "flylaya-fig1@3x.png"); URL.revokeObjectURL(url); }, "image/png");
  };
  img.src = url;
}
</script>
