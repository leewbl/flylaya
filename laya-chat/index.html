<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya Chat</title>
<style>
  :root {
    --bg: #0d0f13; --panel: #16191f; --bubble-user: #2b5fff; --bubble-ai: #1c2027;
    --text: #e8eaf0; --dim: #8b93a5; --ok: #3fb96f; --warn: #e0a83a; --bad: #e0564f;
    --border: #262b34;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
  header .logo { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg,#5b8cff,#a05bff); display: grid; place-items: center; font-weight: 700; }
  header h1 { font-size: 16px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  #clear { margin-left: auto; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 12px; }
  #clear:hover { color: var(--text); border-color: var(--dim); }
  #chat { flex: 1; overflow-y: auto; padding: 24px 0; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; gap: 16px; }
  .msg { display: flex; gap: 10px; }
  .msg .av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .av { background: #2b5fff; }
  .msg.ai .av { background: linear-gradient(135deg,#5b8cff,#a05bff); }
  .body { max-width: 78%; border-radius: 14px; padding: 10px 14px; white-space: pre-wrap; word-break: break-word; }
  .msg.user .body { background: var(--bubble-user); border-top-right-radius: 4px; }
  .msg.ai .body { background: var(--bubble-ai); border-top-left-radius: 4px; padding: 12px; width: min(560px, 92%); white-space: normal; }
  .meta { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--dim); }
  .badge.model { color: #9db4ff; border-color: #35406b; }
  .card { background: #141821; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .card .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .card .k { color: var(--dim); font-size: 12px; }
  .card .v { font-size: 15px; font-weight: 600; }
  .bar { height: 6px; border-radius: 4px; background: #232936; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg,#5b8cff,#7fd0ff); }
  .probs { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
  .prob { display: grid; grid-template-columns: 92px 1fr 44px; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); }
  .prob .bar > i { background: #3a4souff; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 8px; border: 1px solid var(--border); margin: 2px 4px 2px 0; }
  .chip b { font-weight: 600; }
  .chip.on { color: var(--bad); border-color: #5b2f2c; background: #2a1a19; }
  .chip.off { color: var(--ok); border-color: #234530; background: #16211a; }
  .chip.mid { color: var(--warn); border-color: #57431f; background: #262012; }
  .meter { display: flex; gap: 4px; margin-top: 6px; }
  .meter i { flex: 1; height: 10px; border-radius: 3px; background: #232936; }
  .meter i.hit { background: linear-gradient(90deg,#e0a83a,#e0564f); }
  .thinking { color: var(--dim); font-style: italic; }
  footer { border-top: 1px solid var(--border); padding: 16px 0 22px; }
  .input { max-width: 760px; margin: 0 auto; padding: 0 20px; display: flex; gap: 10px; }
  #q { flex: 1; background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 12px; padding: 12px 14px; font: inherit; outline: none; resize: none; max-height: 120px; }
  #q:focus { border-color: #3a4763; }
  #send { background: var(--bubble-user); color: #fff; border: none; border-radius: 12px; padding: 0 20px; cursor: pointer; font-size: 14px; }
  #send:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 8px auto 0; padding: 0 20px; color: var(--dim); font-size: 11px; }
</style>
</head>
<body>
<header>
  <div class="logo">L</div>
  <div>
    <h1>Laya Chat</h1>
    <div class="sub">System 1 决策模型 · 不生成文本，输出结构化判断（意图 / 紧急度 / 风险 / 情感）</div>
  </div>
  <button id="clear">清空</button>
</header>
<div id="chat"><div class="wrap" id="msgs"></div></div>
<footer>
  <div class="input">
    <textarea id="q" rows="1" placeholder="输入任意文本：工单、邮件、评论…（Enter 发送，Shift+Enter 换行）"></textarea>
    <button id="send">发送</button>
  </div>
  <div class="hint">中文自动路由 multilingual；churn/紧急度在中文上的置信度已知偏低（见测试报告）</div>
</footer>
<script>
const QUESTIONS = {
  intent: { type: "choice", instructions: "这条消息的意图是什么？",
    criteria: { question: "提问、咨询、求助", complaint: "投诉、不满、纠纷",
                billing: "账单、付款、退款问题", technical: "技术故障、报错、异常",
                spam: "垃圾信息、广告推销", other: "其他" } },
  sentiment: { type: "choice", instructions: "情感倾向？",
    criteria: { positive: "满意、感谢、赞扬", neutral: "中性、陈述事实", negative: "不满、生气、失望" } },
  urgency: { type: "score", instructions: "紧急程度？",
    criteria: ["不急", "尽快", "紧急阻断"] },
  threat: { type: "noul", instructions: "用户是否威胁要取消、离开或升级投诉？" }
};
const LABEL = { intent: "意图", sentiment: "情感", urgency: "紧急度", spam: "垃圾信息", threat: "取消/升级威胁" };

const msgs = document.getElementById("msgs"), chat = document.getElementById("chat");
const q = document.getElementById("q"), send = document.getElementById("send");

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addUser(text) {
  const m = el("div", "msg user");
  m.appendChild(el("div", "av", "你"));
  m.appendChild(el("div", "body", esc(text)));
  msgs.appendChild(m); chat.scrollTop = chat.scrollHeight;
}

function addAI() {
  const m = el("div", "msg ai");
  m.appendChild(el("div", "av", "L"));
  const b = el("div", "body");
  b.innerHTML = '<span class="thinking">判断中…</span>';
  m.appendChild(b); msgs.appendChild(m); chat.scrollTop = chat.scrollHeight;
  return b;
}

function pct(x) { return (x * 100).toFixed(1) + "%"; }

function renderCard(b, key, a) {
  const c = el("div", "card");
  const head = el("div", "row");
  head.appendChild(el("span", "k", LABEL[key] || key));
  if (a.type === "choice") {
    head.appendChild(el("span", "v", `${esc(a.choice)} · ${pct(a.probabilities[a.choice])}`));
    c.appendChild(head);
    const ps = el("div", "probs");
    Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 4).forEach(([k, v]) => {
      const p = el("div", "prob");
      p.innerHTML = `<span>${esc(k)}</span><span class="bar"><i style="width:${(v * 100).toFixed(1)}%"></i></span><span>${pct(v)}</span>`;
      ps.appendChild(p);
    });
    c.appendChild(ps);
  } else if (a.type === "score") {
    const n = a.probabilities ? Object.keys(a.probabilities).length : 3;
    const lvl = Math.round(Math.min(n - 1, Math.max(0, a.score)));
    head.appendChild(el("span", "v", `${a.score.toFixed(2)} / ${n - 1}（${esc((a.legend || {})[String(lvl)] || lvl)}）`));
    c.appendChild(head);
    const m = el("div", "meter");
    for (let i = 0; i < n; i++) m.appendChild(el("i", i <= lvl ? "hit" : ""));
    c.appendChild(m);
  } else {
    head.appendChild(el("span", "v", pct(a.noul)));
    c.appendChild(head);
  }
  b.appendChild(c);
}

function renderNouls(b, answers) {
  const wrap = el("div", "");
  const one = (key, a) => {
    const v = a.noul, cls = v >= .5 ? "on" : v >= .25 ? "mid" : "off";
    const c = el("span", "chip " + cls);
    c.innerHTML = `${LABEL[key]}：<b>${pct(v)}</b>`;
    wrap.appendChild(c);
  };
  if (answers.spam) one("spam", answers.spam);
  if (answers.threat) one("threat", answers.threat);
  if (wrap.children.length) b.appendChild(wrap);
}

async function ask() {
  const text = q.value.trim();
  if (!text || send.disabled) return;
  q.value = ""; q.style.height = "auto";
  addUser(text);
  send.disabled = true;
  const b = addAI();
  const t0 = performance.now();
  try {
    const r = await fetch("/v1/systemone", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ state: { body: text }, questions: QUESTIONS })
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const j = await r.json();
    const ms = (performance.now() - t0).toFixed(0);
    b.innerHTML = "";
    const meta = el("div", "meta");
    meta.appendChild(el("span", "badge model", "checkpoint: " + (j.routing ? j.routing.model : "?")));
    meta.appendChild(el("span", "badge", ms + " ms"));
    b.appendChild(meta);
    renderCard(b, "intent", j.answers.intent);
    renderCard(b, "urgency", j.answers.urgency);
    renderCard(b, "sentiment", j.answers.sentiment);
    renderNouls(b, j.answers);
  } catch (e) {
    b.innerHTML = `<span style="color:var(--bad)">请求失败：${esc(String(e))}</span>`;
  } finally {
    send.disabled = false; q.focus();
    chat.scrollTop = chat.scrollHeight;
  }
}

send.onclick = ask;
document.getElementById("clear").onclick = () => { msgs.innerHTML = ""; q.focus(); };
q.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(); }
});
q.addEventListener("input", () => { q.style.height = "auto"; q.style.height = Math.min(120, q.scrollHeight) + "px"; });
q.focus();
</script>
</body>
</html>
