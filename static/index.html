<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FlyLaya M1</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14;
               font-family: ui-monospace, Menlo, monospace; color: #d5dae3; }
  #hud { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(10,14,22,.82);
         border: 1px solid #2a3346; border-radius: 8px; padding: 10px 14px; font-size: 12px;
         line-height: 1.55; min-width: 240px; white-space: pre; }
  #hud b { color: #7fd1ff; }
  #bar { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
         display: flex; gap: 8px; background: rgba(10,14,22,.82); border: 1px solid #2a3346;
         border-radius: 10px; padding: 8px 10px; }
  #bar button, #bar select, #bar input { background: #1b2233; color: #d5dae3; border: 1px solid #33405c;
         border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
  #bar button:hover { background: #27334d; }
  #bar .lit { background: #2c4a75; border-color: #4a7bc0; }
  #log { position: fixed; top: 10px; right: 10px; z-index: 10; font-size: 11px; color: #6f7a90;
         text-align: right; white-space: pre; }
</style>
</head>
<body>
<div id="hud">connecting…</div>
<div id="log"></div>
<div id="bar">
  <button id="pause">⏸ 暂停</button>
  <select id="speed">
    <option value="0.25">0.25×</option>
    <option value="0.5">0.5×</option>
    <option value="1" selected>1×</option>
    <option value="2">2×</option>
  </select>
  <button id="cam" class="lit">相机：环绕</button>
  <input id="seed" type="number" value="0" style="width:86px" title="seed">
  <button id="reset">重置(seed)</button>
  <button id="random">随机seed</button>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const hud = document.getElementById('hud'), log = document.getElementById('log');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e14);
scene.fog = new THREE.Fog(0x0b0e14, 1.4, 3.2);
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, .01, 50);
camera.position.set(1.25, 1.05, 1.25);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(.5,.5,.5);

// lights
scene.add(new THREE.AmbientLight(0x334, 0.6));
const sunLight = new THREE.DirectionalLight(0xfff2cc, 2.2);
scene.add(sunLight);

// arena wireframe
const box = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1,1,1)),
  new THREE.LineBasicMaterial({color:0x33415e}));
box.position.set(.5,.5,.5); scene.add(box);
const grid = new THREE.GridHelper(1, 10, 0x22304a, 0x182238);
grid.position.set(.5,0,.5); scene.add(grid);

// fly body + wings
const fly = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(.012,.03,4,8),
  new THREE.MeshStandardMaterial({color:0xd0a860, emissive:0x241a06}));
body.rotation.x = Math.PI/2; fly.add(body);
for (const s of [-1,1]) {
  const wing = new THREE.Mesh(new THREE.PlaneGeometry(.05,.018),
    new THREE.MeshBasicMaterial({color:0xbfd8ff, transparent:true, opacity:.4, side:THREE.DoubleSide}));
  wing.position.set(s*.028,.004,-.008); wing.rotation.z = s*.5; wing.userData.side=s;
  fly.add(wing); fly.userData['wing'+s] = wing;
}
const nose = new THREE.Mesh(new THREE.ConeGeometry(.006,.02,8),
  new THREE.MeshBasicMaterial({color:0xff7f7f}));
nose.rotation.x = Math.PI/2; nose.position.z = .028; fly.add(nose);
scene.add(fly);

// trajectory ribbon
const TRAIL_N = 3000;
const trailGeo = new THREE.BufferGeometry();
const trailPos = new Float32Array(TRAIL_N*3);
trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPos,3));
trailGeo.setDrawRange(0,0);
const trail = new THREE.Line(trailGeo, new THREE.LineBasicMaterial({color:0x7fd1ff}));
scene.add(trail);
let trailLen = 0;

let obstacles = [];
function buildScene(msg){
  for (const o of obstacles) scene.remove(o); obstacles = [];
  for (const ob of msg.obstacles){
    const m = new THREE.Mesh(new THREE.CylinderGeometry(ob.r, ob.r, ob.h, 20),
      new THREE.MeshStandardMaterial({color:0x3b4a68, roughness:.85}));
    m.position.set(ob.x, ob.h/2, ob.z); scene.add(m); obstacles.push(m);
  }
  const s = new THREE.Vector3(...msg.sun);
  sunLight.position.copy(s.clone().multiplyScalar(2).add(new THREE.Vector3(.5,.5,.5)));
  sunLight.target.position.set(.5,.5,.5); scene.add(sunLight.target);
  trailLen = 0; trailGeo.setDrawRange(0,0);
}

// ws
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = (e) => {
  const msg = JSON.parse(e.data);
  if (msg.type === 'scene') { buildScene(msg); return; }
  const f = msg.fly;
  fly.position.set(...f.pos);
  const h = new THREE.Vector3(...f.heading);
  fly.lookAt(fly.position.clone().add(h));
  const t = performance.now()/1000;
  for (const s of [-1,1]) fly.userData['wing'+s].rotation.z = s*(.5+.45*Math.sin(t*220));
  if (msg.trail){
    if (trailLen < TRAIL_N) trailLen++;
    trailPos.copyWithin(0,3);
    const i = (TRAIL_N-1)*3;
    trailPos[i]=msg.trail[0]; trailPos[i+1]=msg.trail[1]; trailPos[i+2]=msg.trail[2];
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.setDrawRange(0, trailLen);
  }
  const d = msg.hud.dn || {};
  hud.innerHTML =
    `<b>FlyLaya M1</b>  brain=${msg.hud.brain}  seed=${msg.hud.seed}\n` +
    `t=${msg.t.toFixed(1)}s  frame=${msg.hud.frame}  rt×${msg.hud.rt_factor}` +
    (msg.hud.paused?'  <b>PAUSED</b>':'') + `\n` +
    `pos (${f.pos.map(v=>v.toFixed(2))})  v=${f.speed.toFixed(3)} m/s\n` +
    `intent <b>${msg.hud.intent}</b>  conf=${msg.hud.intent_confidence.toFixed(2)}\n` +
    `spikes ${msg.hud.mean_spikes_hz} Hz\n` +
    `DNp20 L/R ${d['DNp20_L']??'-'} / ${d['DNp20_R']??'-'}  MDN ${(d['MDN_L']??0).toFixed?.(1)??'-'}\n` +
    `DNa02 L/R ${d['DNa02_L']??'-'} / ${d['DNa02_R']??'-'}`;
  log.textContent = `ws ok  frames=${msg.hud.frame}`;
};

// controls bar
const send = o => ws.readyState===1 && ws.send(JSON.stringify(o));
const pauseBtn = document.getElementById('pause');
pauseBtn.onclick = () => {
  const paused = pauseBtn.textContent.includes('暂停');
  send({cmd: paused?'pause':'resume'});
  pauseBtn.textContent = paused ? '▶ 继续' : '⏸ 暂停';
};
document.getElementById('speed').onchange = e =>
  send({cmd:'speed', value: parseFloat(e.target.value)});
const camBtn = document.getElementById('cam');
let follow = false;
camBtn.onclick = () => {
  follow = !follow; controls.enabled = !follow;
  camBtn.textContent = follow ? '相机：跟随' : '相机：环绕';
  camBtn.classList.toggle('lit', !follow);
};
document.getElementById('reset').onclick = () =>
  send({cmd:'reseed', value: parseInt(document.getElementById('seed').value)||0});
document.getElementById('random').onclick = () =>
  send({cmd:'reseed', value: Math.floor(Math.random()*1e9)});

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

(function animate(){
  requestAnimationFrame(animate);
  if (follow){
    const back = fly.getWorldDirection(new THREE.Vector3()).multiplyScalar(-.22);
    camera.position.lerp(fly.position.clone().add(back).add(new THREE.Vector3(0,.08,0)), .08);
    controls.target.lerp(fly.position, .2);
  } else {
    controls.update();
  }
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
