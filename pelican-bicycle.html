<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f5ee">
  <title>鹈鹕的海边骑行 · Pelican on Wheels</title>
  <style>
    :root { color-scheme: light; --paper: #f7f5ee; --ink: #29483f; --muted: #75847b; --line: #dedfd3; --orange: #c86a48; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
    button { font: inherit; -webkit-tap-highlight-color: transparent; }
    button:focus-visible { outline: 3px solid #5d8d7e; outline-offset: 5px; }
    .page { max-width: 1360px; margin: 0 auto; padding: 30px 54px 24px; }
    .masthead { display: flex; align-items: center; justify-content: space-between; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; gap: 10px; align-items: center; font-weight: 750; font-size: 13px; letter-spacing: 2px; }
    .brand svg { width: 30px; height: 30px; }
    .edition { color: var(--muted); font-size: 11px; letter-spacing: 2px; }
    .intro { display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; padding: 34px 0 28px; }
    .eyebrow { font-size: 10px; font-weight: 650; letter-spacing: 2.5px; color: var(--orange); margin: 0 0 13px; }
    h1 { font-size: clamp(28px, 3.6vw, 46px); letter-spacing: -1.6px; font-weight: 650; line-height: 1.24; margin: 0; }
    .intro-copy { margin: 13px 0 0; font-size: 13px; letter-spacing: .4px; color: var(--muted); line-height: 1.8; }
    .scene-note { display: flex; align-items: center; gap: 13px; margin-bottom: 3px; }
    .scene-note svg { width: 48px; height: 48px; flex-shrink: 0; }
    .scene-note p { font-size: 11px; line-height: 1.9; margin: 0; color: var(--muted); }
    .scene-note strong { display: block; color: var(--ink); font-size: 12px; font-weight: 550; }
    .scene { position: relative; overflow: hidden; border: 1px solid #d7e2d7; border-radius: 20px; background: #e4efea; }
    .landscape { display: block; width: 100%; height: auto; }
    .scene-label { position: absolute; top: 23px; left: 27px; font-size: 10px; font-weight: 600; letter-spacing: 2px; color: #627c70; }
    .live { position: absolute; top: 22px; right: 24px; display: flex; align-items: center; gap: 7px; border: 1px solid #bacfc1; padding: 7px 10px; border-radius: 30px; color: #536e60; font-size: 10px; background: #f5f8eb70; }
    .live-dot { width: 5px; height: 5px; border-radius: 50%; background: #719478; }
    .scene-caption { position: absolute; left: 28px; bottom: 22px; color: #5b7367; font-size: 10px; letter-spacing: 1.3px; }
    .scene-number { position: absolute; right: 27px; bottom: 21px; font-family: Georgia, serif; font-style: italic; font-size: 24px; color: #7f9482; }
    .controls { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 20px 0 19px; border-bottom: 1px solid var(--line); }
    .play-area, .speed-area, .speed-options { display: flex; align-items: center; }
    .play-area { gap: 12px; }
    .play-button { display: grid; place-items: center; width: 41px; height: 41px; border: 0; border-radius: 50%; color: var(--paper); background: var(--ink); cursor: pointer; transition: background .18s, transform .18s; }
    .play-button:hover { background: #446b59; transform: scale(1.04); }
    .play-button svg { width: 16px; height: 16px; }
    .play-text { font-size: 12px; font-weight: 550; }
    .play-hint { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); font-weight: 400; }
    .speed-area { gap: 13px; }
    .speed-label { color: var(--muted); font-size: 11px; }
    .speed-options { background: #ebece2; padding: 4px; gap: 3px; border-radius: 30px; }
    .speed-button { padding: 8px 17px; border: 0; color: #7a8478; background: transparent; font-size: 11px; border-radius: 22px; cursor: pointer; transition: color .18s, background .18s; }
    .speed-button:hover { color: var(--ink); }
    .speed-button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 5px #29483f0c; }
    .footer { display: flex; justify-content: space-between; padding-top: 17px; gap: 20px; color: #8a9386; font-size: 10px; letter-spacing: .7px; }
    .footer span:last-child { font-family: Georgia, serif; font-size: 12px; font-style: italic; }
    @media (min-width: 1450px) { .page { padding-top: 40px; } }
    @media (max-width: 700px) {
      .page { padding: 22px 20px; }
      .masthead { padding-bottom: 19px; }
      .brand { font-size: 11px; letter-spacing: 1.4px; }
      .edition { font-size: 9px; letter-spacing: 1px; }
      .intro { padding: 29px 0 24px; }
      h1 { font-size: 32px; letter-spacing: -1px; }
      .intro-copy { font-size: 12px; max-width: 225px; }
      .scene-note { display: none; }
      .scene { border-radius: 15px; }
      .landscape { width: 160%; max-width: none; margin-left: -30%; }
      .scene-label { top: 16px; left: 16px; font-size: 8px; letter-spacing: 1px; }
      .live { top: 13px; right: 13px; padding: 6px 8px; font-size: 9px; }
      .scene-caption { bottom: 16px; left: 16px; font-size: 8px; letter-spacing: .4px; }
      .scene-number { bottom: 12px; right: 15px; font-size: 21px; }
      .controls { padding: 18px 0; gap: 10px; }
      .play-area { gap: 9px; }
      .play-text { font-size: 11px; }
      .play-hint { font-size: 9px; }
      .speed-area { gap: 6px; }
      .speed-label { display: none; }
      .speed-button { padding: 8px 12px; font-size: 10px; }
      .footer { font-size: 8px; letter-spacing: .2px; }
      .footer span:last-child { font-size: 10px; }
    }
    @media (max-width: 360px) {
      .page { padding-inline: 14px; }
      .brand { gap: 6px; }
      .speed-button { padding-inline: 9px; }
      .play-hint { display: none; }
    }
  </style>
</head>

    <section class="controls" aria-label="动画控制">
      <div class="play-area">
        <button class="play-button" id="play-button" type="button" aria-label="暂停动画" aria-pressed="false">
          <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true" id="play-icon"><path d="M5 4h3v12H5zm7 0h3v12h-3z"/></svg>
        </button>
        <div class="play-text"><span id="play-text">让好心情继续</span><span class="play-hint">点一下，歇一会儿</span></div>
      </div>
      <div class="speed-area">
        <span class="speed-label">骑行节奏</span>
        <div class="speed-options" role="group" aria-label="骑行速度">
          <button class="speed-button" type="button" data-speed="0.6" aria-pressed="false">悠闲</button>
          <button class="speed-button" type="button" data-speed="1" aria-pressed="true">日常</button>
          <button class="speed-button" type="button" data-speed="1.6" aria-pressed="false">追风</button>
        </div>
      </div>
    </section>
    <footer class="footer"><span>纯 SVG 绘制 · 一段可以一直骑下去的小动画</span><span>Life is better on two wheels.</span></footer>
    <noscript><p>启用 JavaScript 后，鹈鹕就会开始踩踏骑行。</p></noscript>
  </main>

  <script>
    (() => {
      'use strict';
      const byId = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'crank', 'rear-pedal', 'front-pedal',
        'rear-leg-path', 'front-leg-path', 'rear-foot', 'front-foot', 'toe-lines',
        'pelican', 'bike-shadow', 'scarf-tail', 'scarf-seam', 'road',
        'back-scenery', 'foreground', 'clouds', 'water-lines', 'wind', 'distant-birds'
      ].map(id => [id, byId(id)]));
      const playButton = byId('play-button');
      const speedButtons = [...document.querySelectorAll('[data-speed]')];
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let elapsed = 0;
      let previousTime = null;
      let requestId = null;

      // A two-segment leg keeps each foot on its pedal through the whole turn.
      function positionLeg(side, foot, bob) {
        const hip = { x: 493, y: 323 + bob };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.hypot(dx, dy);
        const upper = 86;
        const lower = 82;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const bend = Math.sqrt(Math.max(0, upper * upper - along * along));
        const kneeX = hip.x + along * dx / distance + bend * dy / distance;
        const kneeY = hip.y + along * dy / distance - bend * dx / distance;
        parts[side + '-leg-path'].setAttribute('d', `M${hip.x} ${hip.y}L${kneeX} ${kneeY}L${foot.x} ${foot.y}`);
        const placement = `translate(${foot.x} ${foot.y})`;
        parts[side + '-foot'].setAttribute('transform', placement);
        parts[side + '-pedal'].setAttribute('transform', placement);
        if (side === 'front') parts['toe-lines'].setAttribute('transform', placement);
      }

      function draw(t) {
        const angle = t * 2.8;
        const bob = Math.sin(angle * 2) * 2;
        const pedalX = Math.cos(angle) * 30;
        const pedalY = Math.sin(angle) * 30;
        const wheelAngle = t * 4.6 * 180 / Math.PI;
        parts['rear-wheel'].setAttribute('transform', `translate(420 448) rotate(${wheelAngle})`);
        parts['front-wheel'].setAttribute('transform', `translate(714 448) rotate(${wheelAngle})`);
        parts.crank.setAttribute('transform', `rotate(${angle * 180 / Math.PI} 538 448)`);
        positionLeg('front', { x: 538 + pedalX, y: 448 + pedalY }, bob);
        positionLeg('rear', { x: 538 - pedalX, y: 448 - pedalY }, bob);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts['bike-shadow'].setAttribute('rx', 202 + bob * 1.3);

        const flutter = Math.sin(t * 7) * 4;
        parts['scarf-tail'].setAttribute('d', `M563 238c-30-22-48-12-68 ${-21 + flutter}-16-8-27-6-37-2l11 8-13 8c25-8 35 10 57 11 15 1 27-4 47 6Z`);
        parts['scarf-seam'].setAttribute('d', `M467 ${220 + flutter}c25-8 30 14 53 13 13 0 23-1 35 ${10 - flutter}`);
        parts.road.setAttribute('transform', `translate(${-((t * 340.4) % 1200)} 0)`);
        parts['back-scenery'].setAttribute('transform', `translate(${-((t * 240) % 1200)} 0)`);
        parts.foreground.setAttribute('transform', `translate(${-((t * 365) % 1200)} 0)`);
        parts.clouds.setAttribute('transform', `translate(${Math.sin(t * .08) * 19} 0)`);
        parts['water-lines'].setAttribute('transform', `translate(${Math.sin(t * .5) * 6} 0)`);
        parts['distant-birds'].setAttribute('transform', `translate(${Math.sin(t * .12) * 9} ${Math.sin(t * .8) * 2})`);
        parts.wind.setAttribute('opacity', .35 + (Math.sin(t * 3) + 1) * .16);
      }

      function frame(now) {
        requestId = null;
        if (!playing || document.hidden) return;
        if (previousTime !== null) elapsed += Math.min((now - previousTime) / 1000, .05) * speed;
        previousTime = now;
        draw(elapsed);
        requestId = requestAnimationFrame(frame);
      }

      function schedule() {
        previousTime = null;
        if (playing && !document.hidden && requestId === null) requestId = requestAnimationFrame(frame);
      }

      function updatePlayback() {
        playButton.setAttribute('aria-label', playing ? '暂停动画' : '播放动画');
        playButton.setAttribute('aria-pressed', String(!playing));
        byId('play-icon').innerHTML = playing
          ? '<path d="M5 4h3v12H5zm7 0h3v12h-3z"/>'
          : '<path d="m6 3 11 7-11 7Z"/>';
        byId('play-text').textContent = playing ? '让好心情继续' : '停下来，看看海';
        document.querySelector('.play-hint').textContent = playing ? '点一下，歇一会儿' : '点一下，接着出发';
        byId('live-label').textContent = playing ? '正在兜风' : '休息片刻';
        byId('live-dot').style.background = playing ? '#719478' : '#b69c70';
        if (requestId !== null) cancelAnimationFrame(requestId);
        requestId = null;
        schedule();
      }

      playButton.addEventListener('click', () => { playing = !playing; updatePlayback(); });
      speedButtons.forEach(button => button.addEventListener('click', () => {
        speed = Number(button.dataset.speed);
        speedButtons.forEach(option => option.setAttribute('aria-pressed', String(option === button)));
      }));
      document.addEventListener('visibilitychange', () => {
        if (document.hidden && requestId !== null) {
          cancelAnimationFrame(requestId);
          requestId = null;
        }
        schedule();
      });
      reducedMotion.addEventListener('change', event => {
        playing = !event.matches;
        updatePlayback();
      });
      draw(0);
      updatePlayback();
    })();
  </script>
</body>
</html>
