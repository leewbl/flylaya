<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FlyLaya M5 — 果蝇飞行测试台</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #79a6ff;
    font-family: "Courier New", ui-monospace, monospace; }
  canvas#gl { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; color: #fff; text-shadow: 2px 2px 0 #000c;
    font-size: 13px; line-height: 1.5; user-select: none; }
  .panel { background: rgba(16, 12, 8, 0.72); border: 3px solid #000;
    box-shadow: inset 0 0 0 2px #5a5a5a, 0 4px 0 #0006; padding: 8px 10px; }
  #info { top: 10px; left: 10px; width: 262px; }
  #right { top: 10px; right: 10px; width: 240px; }
  #ctrl { bottom: 10px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; align-items: center; pointer-events: auto; flex-wrap: wrap; }
  button, select, input { pointer-events: auto; font: inherit; }
  button { background: #6f6f6f; color: #fff; border: 2px solid #000;
    box-shadow: inset -2px -2px 0 #4a4a4a, inset 2px 2px 0 #9a9a9a;
    padding: 3px 10px; cursor: pointer; }
  button.active { background: #4a7fb5; box-shadow: inset 2px 2px 0 #2d517a; }
  button:disabled { opacity: .45; cursor: default; }
  #tlwrap { position: absolute; left: 10px; right: 260px; bottom: 58px;
    pointer-events: auto; }
  #timeline { width: 100%; height: 20px; display: block; cursor: crosshair;
    border: 2px solid #000; background: #111; }
  #altwrap { position: absolute; right: 10px; top: 250px; bottom: 100px; width: 34px; }
  #alt { width: 100%; height: 100%; display: block; background: rgba(0,0,0,.4);
    border: 2px solid #000; }
  .intent-big { font-size: 17px; font-weight: bold; }
  .bar { height: 9px; background: #222; border: 2px solid #000; margin: 2px 0 5px; }
  .bar > div { height: 100%; }
  .row { display: flex; justify-content: space-between; }
  .dim { color: #aaa; } .hearts { letter-spacing: 1px; }
  #toast { top: 70px; left: 50%; transform: translateX(-50%); padding: 6px 16px;
    display: none; }
  #evlist { max-height: 110px; overflow: auto; font-size: 11px; }
</style>
<script type="importmap">
  { "imports": { "three": "https://unpkg.com/three@0.169.0/build/three.module.js" } }
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud panel" id="info">
  <div class="row"><b id="scene">—</b><span class="dim" id="t">0s</span></div>
  <div class="dim" id="meta1">—</div>
  <div>pos <span id="pos">—</span> m · <span id="speed">—</span> m/s</div>
  <div>yaw <span id="yaw">—</span>° · z <span id="z">—</span> m · gap <span id="gap">—</span></div>
</div>

<div class="hud panel" id="right">
  <div class="row"><b>意图 / 调制</b><span class="dim" id="src">—</span></div>
  <div class="intent-big" id="intent">—</div>
  <div class="row dim"><span>confidence/applied</span><span id="conf">—</span></div>
  <div class="row"><span class="dim">arousal</span><span class="hearts" id="arousal"></span></div>
  <div class="dim" style="margin-top:4px">gains_post</div><div id="gains"></div>
  <div class="dim" style="margin-top:4px">DN 读出</div><div id="dn"></div>
  <div class="dim" style="margin-top:4px">事件</div><div id="evlist">—</div>
</div>

<div class="hud panel" id="toast"></div>
<div id="altwrap"><canvas id="alt"></canvas></div>
<div id="tlwrap"><canvas id="timeline"></canvas></div>
<div class="hud panel" id="ctrl">
  <button id="mReplay" class="active">回放</button>
  <button id="mLive">实时仿真</button>
  <select id="runSel" title="run"></select>
  <span id="liveForm" style="display:none">
    <select id="lvScene"></select><select id="lvPolicy">
      <option>P_fixed</option><option>P_rule</option><option>P_laya</option><option>P_yoked</option>
    </select><select id="lvBrain"><option>skeleton</option><option>connectome</option></select>
    <input id="lvSeed" type="number" value="42" style="width:64px" title="seed">
    <input id="lvSec" type="number" value="15" step="5" style="width:56px" title="秒">
    <button id="lvGo">▶ 开跑</button>
  </span>
  <button id="play">⏸</button>
  <label>速度 <input id="spd" type="range" min="0.25" max="8" step="0.25" value="1">
    <span id="spdv">1×</span></label>
  <button id="viewBtn">侧视</button>
  <label><input id="follow" type="checkbox" checked> 跟随</label>
</div>

<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const ICOLOR = { phototaxis:"#ffd27f", avoid_obstacle:"#ff6a4a", explore:"#6adf8a",
                 center_in_arena:"#4a9fe4", rest_hover:"#8a8adf" };
const EV_COLOR = { stimulus_on:"#ffe14a", turn_start:"#4adfff", turn_end:"#4adfff",
                   obstacle_contact:"#ff4a4a", wall_contact:"#ff4a4a", sun_lost:"#888" };

/* ---------- three 场景 (mc_view 美学) ---------- */
const renderer = new THREE.WebGLRenderer({ canvas: $('gl'), antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x79a6ff);
scene.fog = new THREE.Fog(0x79a6ff, 400, 1100);
const camera = new THREE.PerspectiveCamera(55, 1, 1, 2000);
camera.position.set(150, 110, -170);
const controls = { target: new THREE.Vector3(50, 45, 50) };
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x6b8f4f, 0.9); scene.add(hemi);
const sunLight = new THREE.DirectionalLight(0xfff2cc, 1.1);
sunLight.target.position.set(50, 50, 50); scene.add(sunLight, sunLight.target);

const rndT = (a, b) => a + Math.random() * (b - a);
function speckTex(base, vary) {
  const c = document.createElement('canvas'); c.width = c.height = 8;
  const g = c.getContext('2d');
  const b = [1, 3, 5].map(i => parseInt(base.slice(i, i + 2), 16));
  g.fillStyle = base; g.fillRect(0, 0, 8, 8);
  for (let i = 0; i < 400; i++) { const v = rndT(-1, 1);
    g.fillStyle = `rgb(${b.map((cc, j) => Math.round(Math.max(0, Math.min(255, cc + v * vary[j])))).join(',')})`;
    g.fillRect(rndT(0, 8) | 0, rndT(0, 8) | 0, 1, 1); }
  const t = new THREE.CanvasTexture(c);
  t.magFilter = t.minFilter = THREE.NearestFilter; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const MAT = {
  grass: new THREE.MeshLambertMaterial({ map: speckTex('#5d9b3f', [30, 44, 22]) }),
  stone: new THREE.MeshLambertMaterial({ map: speckTex('#8a8a8a', [22, 22, 22]) }),
  moss:  new THREE.MeshLambertMaterial({ map: speckTex('#8a8a8a', [22, 22, 22]), transparent: true, opacity: 0.35 }),
  obs:   new THREE.MeshLambertMaterial({ map: speckTex('#241b33', [14, 8, 20]) }),
  ghost: new THREE.MeshLambertMaterial({ color: 0x9fdfff, transparent: true, opacity: 0.18 }),
  sun:   new THREE.MeshBasicMaterial({ color: 0xffe08a }),
};
const _m = new THREE.Matrix4();

let world = new THREE.Group(); scene.add(world);
let flyG = null, trail = null, shadow = null;
const TRAIL_N = 300;

function buildWorld(sceneJ) {   // scene.v1 -> 方块世界 (m -> cm ×100)
  if (world) scene.remove(world);
  world = new THREE.Group(); scene.add(world);
  const floor = new THREE.InstancedMesh(new THREE.BoxGeometry(4, 4, 4), MAT.grass, 625);
  let k = 0;
  for (let i = 0; i < 25; i++) for (let j = 0; j < 25; j++) {
    _m.setPosition(2 + i * 4, -2, 2 + j * 4); floor.setMatrixAt(k++, _m); }
  world.add(floor);
  const wall = new THREE.InstancedMesh(new THREE.BoxGeometry(4, 4, 4), MAT.stone, 104);
  let wk = 0;
  for (let i = 0; i <= 25; i++) {
    _m.setPosition(i * 4, 2, -2); wall.setMatrixAt(wk++, _m);
    _m.setPosition(i * 4, 2, 102); wall.setMatrixAt(wk++, _m);
    _m.setPosition(-2, 2, i * 4); wall.setMatrixAt(wk++, _m);
    _m.setPosition(102, 2, i * 4); wall.setMatrixAt(wk++, _m); }
  world.add(wall);

  // 光源
  if (sceneJ && sceneJ.light && sceneJ.light.mode === 'directional') {
    const L = sceneJ.light;
    const az = L.azimuth_deg * Math.PI / 180, el = L.elevation_deg * Math.PI / 180;
    const u = [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
    const sun = new THREE.Mesh(new THREE.BoxGeometry(8, 8, 8), MAT.sun.clone());
    sun.position.set(50 + 45 * u[0], 30 + 50 * u[2], 50 + 45 * u[1]);
    sun.userData = { kind: 'light', on: !!L.initially_on };
    sun.visible = sun.userData.on;
    world.add(sun);
    sunLight.position.set(50 + 300 * u[0], 20 + 300 * u[2], 50 + 300 * u[1]);
    sunLight.visible = sun.visible;
    sunLight.intensity = 0.4 + 0.8 * (L.intensity ?? 0.9);
    hemi.intensity = 0.55;
  } else {
    sunLight.visible = false;
    const lvl = sceneJ?.light?.level ?? 0.45;
    hemi.intensity = 0.5 + lvl;
  }

  // 障碍 (cylinder -> 方块柱; enabled=false -> ghost)
  for (const o of (sceneJ?.obstacles || [])) {
    const [cx, cz] = o.center_xy_m.map(v => v * 100);
    const r = o.radius_m * 100, h = o.height_m * 100;
    const mat = o.enabled ? (h <= 50 ? MAT.moss : MAT.obs) : MAT.ghost;
    const cells = [];
    for (let y = 2; y <= h; y += 4)
      for (let gx = -r; gx <= r; gx += 4) for (let gz = -r; gz <= r; gz += 4)
        if (gx * gx + gz * gz <= r * r) cells.push([cx + gx, y, cz + gz]);
    const im = new THREE.InstancedMesh(new THREE.BoxGeometry(4.05, 4.05, 4.05), mat, Math.max(1, cells.length));
    cells.forEach((p, i) => { _m.setPosition(...p); im.setMatrixAt(i, _m); });
    im.userData = { kind: 'obstacle', id: o.id, enabled: !!o.enabled };
    world.add(im);
  }

  // 果蝇 + 尾迹 + 地面影子
  flyG = new THREE.Group();
  const ds = o => new THREE.MeshLambertMaterial(o);
  const body = ds({ color: 0x3a2b1e }), dark = ds({ color: 0x241a12 }), eye = ds({ color: 0xb02020 });
  const add = (g, m2, x, y, z) => { const e = new THREE.Mesh(g, m2); e.position.set(x, y, z); flyG.add(e); return e; };
  add(new THREE.BoxGeometry(4.2, 3.0, 3.2), body, 0, 0, 0);
  add(new THREE.BoxGeometry(3.4, 2.6, 2.8), dark, -3.6, -0.2, 0);
  add(new THREE.BoxGeometry(2.2, 2.2, 2.2), body, 3.0, 0, 0);
  add(new THREE.BoxGeometry(1.8, 1.8, 1.8), eye, 3.4, 0.2, 1.2);
  add(new THREE.BoxGeometry(1.8, 1.8, 1.8), eye, 3.4, 0.2, -1.2);
  const wingGeo = new THREE.BoxGeometry(1.2, 0.18, 5.2); wingGeo.translate(0, 0, 2.6);
  const wmat = ds({ color: 0xdfe8ff, transparent: true, opacity: 0.55, side: THREE.DoubleSide });
  const wL = add(wingGeo, wmat, -0.4, 1.8, 0.6), wR = add(wingGeo, wmat, -0.4, 1.8, -0.6);
  const tagC = document.createElement('canvas'); tagC.width = 256; tagC.height = 48;
  const tagT = new THREE.CanvasTexture(tagC); tagT.magFilter = THREE.NearestFilter;
  const tag = new THREE.Sprite(new THREE.SpriteMaterial({ map: tagT, depthTest: false }));
  tag.scale.set(24, 4.5, 1); tag.position.y = 8; flyG.add(tag);
  world.add(flyG);
  trail = new THREE.InstancedMesh(new THREE.BoxGeometry(1.8, 1.8, 1.8),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 }), TRAIL_N);
  trail.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  world.add(trail);
  shadow = new THREE.Mesh(new THREE.BoxGeometry(5, 0.4, 5),
    new THREE.MeshBasicMaterial({ color: 0x223311, transparent: true, opacity: 0.4 }));
  world.add(shadow);
  return { wL, wR, tagC, tagT };
}
let F = buildWorld(null);
const _m4 = new THREE.Matrix4(); const _c = new THREE.Color();
const trailPos = [];

/* ---------- 数据/播放 ---------- */
let run = null, fi = 0, playing = true, speed = 1, live = false, liveAbort = null;
const HZ = 10;  // trajectory dt 0.1s → 真实速率 10 帧/s

function frameAt(i) {
  const fr = run.frames, n = fr.length;
  const i0 = Math.max(0, Math.min(n - 1, i | 0)), t = i - i0, i1 = Math.min(n - 1, i0 + 1);
  const a = fr[i0], b = fr[i1];
  const la = (x, y) => { let d = ((y - x + 540) % 360) - 180; return x + d * t; };
  return { x: a.pos_m[0] + (b.pos_m[0] - a.pos_m[0]) * t,
           y: a.pos_m[1] + (b.pos_m[1] - a.pos_m[1]) * t,
           z: a.pos_m[2] + (b.pos_m[2] - a.pos_m[2]) * t,
           yaw: la(a.yaw_deg, b.yaw_deg), speed: a.speed_m_s, gap: a.min_gap_m,
           intent: a.intent_applied, arousal: a.arousal, dn: a.dn || {},
           gains: a.gains_post?.intent_gains || {}, t: a.t_s };
}

/* 事件应用: stimulus_on 切换光源/障碍实体化 */
function applyEventsTo(uptoT) {
  for (const e of (run?.events || [])) {
    if (e.t_s > uptoT || e.kind !== 'stimulus_on') continue;
    for (const obj of world.children) {
      const u = obj.userData || {};
      if (e.target === 'light' && u.kind === 'light' && !u.on) {
        u.on = true; obj.visible = true; sunLight.visible = true;
        document.body.dataset.stimLight = '1';
      } else if (e.target === u.id && u.kind === 'obstacle' && !u.enabled) {
        u.enabled = true;
        obj.material = MAT.obs; obj.material.needsUpdate = true;
        document.body.dataset['stim_' + u.id] = '1';
      }
    }
  }
}
function resetStimuli() {
  for (const k of Object.keys(document.body.dataset))
    if (k.startsWith('stim')) delete document.body.dataset[k];
  const L = run?.sceneJ?.light;
  for (const obj of world.children) {
    const u = obj.userData || {};
    if (u.kind === 'light') { u.on = !!L?.initially_on; obj.visible = u.on; sunLight.visible = u.on; }
    if (u.kind === 'obstacle') {
      const o = (run?.sceneJ?.obstacles || []).find(x => x.id === u.id);
      u.enabled = !!o?.enabled;
      obj.material = u.enabled ? MAT.obs : MAT.ghost;
    }
  }
}

/* ---------- HUD 构建 ---------- */
const gainsEl = $('gains'), gainRows = {};
const dnEl = $('dn'), dnRows = {};
function ensureRows(el, rows, keys, color) {
  for (const k2 of keys) {
    if (rows[k2]) continue;
    const d = document.createElement('div');
    d.innerHTML = `<div class="row dim"><span style="width:86px">${k2}</span><span id="${el.id}-v-${k2}">—</span></div>
      <div class="bar"><div id="${el.id}-b-${k2}" style="background:${color}"></div></div>`;
    el.appendChild(d); rows[k2] = d;
  }
}
let hudTick = 0, altCtx = $('alt').getContext('2d'), tlCtx = $('timeline').getContext('2d');
function updateHUD(force) {
  if (!run) return;
  const s = frameAt(fi);
  const px3 = s.x * 100, py3 = s.z * 100, pz3 = s.y * 100;
  flyG.position.set(px3, py3, pz3);
  flyG.rotation.order = 'YZX';
  flyG.rotation.y = -s.yaw * Math.PI / 180;
  shadow.position.set(px3, 0.5, pz3);
  const sc = Math.max(0.4, 1.4 - s.z);
  shadow.scale.set(sc, 1, sc); shadow.material.opacity = 0.15 + 0.35 * (1 - s.z);
  const flap = Math.sin(performance.now() * 0.045) * (0.55 + Math.min(s.speed * 100, 30) / 40);
  F.wL.rotation.x = 0.5 + flap; F.wR.rotation.x = -0.5 - flap;
  if (hudTick % 2 === 0) {
    trailPos.push([px3, py3, pz3, ICOLOR[s.intent] || '#88aaff']);
    if (trailPos.length > TRAIL_N) trailPos.shift();
    trail.count = trailPos.length;
    trailPos.forEach((p, i) => { const kk = 1 - i / TRAIL_N * 0.6;
      _m4.makeScale(kk, kk, kk); _m4.setPosition(p[0], p[1], p[2]);
      trail.setMatrixAt(i, _m4); trail.setColorAt(i, _c.set(p[3])); });
    trail.instanceMatrix.needsUpdate = true;
    if (trail.instanceColor) trail.instanceColor.needsUpdate = true;
  }
  if (hudTick % 4 === 0 || force) {
    const g2 = F.tagC.getContext('2d');
    g2.fillStyle = 'rgba(0,0,0,0.55)'; g2.fillRect(0, 0, 256, 48);
    g2.font = 'bold 24px monospace'; g2.textAlign = 'center';
    g2.fillStyle = ICOLOR[s.intent] || '#fff';
    g2.fillText(`${s.intent}`, 128, 33); F.tagT.needsUpdate = true;
    $('t').textContent = s.t.toFixed(1) + 's / ' + (run.frames.at(-1)?.t_s ?? '?') + 's';
    $('pos').textContent = `${s.x.toFixed(2)},${s.y.toFixed(2)},${s.z.toFixed(2)}`;
    $('speed').textContent = s.speed.toFixed(2);
    $('yaw').textContent = ((s.yaw % 360 + 360) % 360).toFixed(0);
    $('z').textContent = s.z.toFixed(2);
    $('gap').textContent = s.gap?.toFixed(2) ?? '—';
    $('intent').textContent = s.intent; $('intent').style.color = ICOLOR[s.intent] || '#fff';
    $('arousal').innerHTML = Array.from({ length: 5 }, (_, i) =>
      `<span style="color:${i < s.arousal * 2.5 ? '#ff3f3f' : '#3a3a3a'}">❤</span>`).join('');
    ensureRows(gainsEl, gainRows, Object.keys(s.gains), '#7fb8ff');
    for (const [k2, v] of Object.entries(s.gains))
      setBar(gainRows, k2, v, 2.75);
    ensureRows(dnEl, dnRows, Object.keys(s.dn), '#ffb87f');
    for (const [k2, v] of Object.entries(s.dn))
      setBar(dnRows, k2, v, 30, true);
    drawAlt(s); drawTimeline();
  }
  hudTick++;
}
function setBar(rows, k2, v, max, signed) {
  const r = rows[k2]; if (!r) return;
  r.querySelector(`[id$=-v-${k2}]`).textContent = (+v).toFixed(2);
  const w = signed ? Math.abs(v) / max : v / max;
  r.querySelector(`[id$=-b-${k2}]`).style.width = Math.min(100, Math.abs(w) * 100) + '%';
}
function drawAlt(s) {
  const c = $('alt'), g = altCtx, W = c.width = c.clientWidth || 34, H = c.height = c.clientHeight || 300;
  g.clearRect(0, 0, W, H);
  g.fillStyle = '#000a'; g.fillRect(0, 0, W, H);
  g.strokeStyle = '#5f5'; g.beginPath();
  const n = run.frames.length;
  for (let i = 0; i <= fi; i += 2) {
    const z = run.frames[Math.min(n - 1, i | 0)].pos_m[2];
    g.lineTo(2 + (i / n) * (W - 4), H - 3 - z * (H - 6));
  }
  g.stroke();
  g.fillStyle = '#fff'; g.fillRect(2 + (fi / n) * (W - 4) - 1,
    H - 3 - s.z * (H - 6) - 2, 4, 4);
}
function drawTimeline() {
  const c = $('timeline'), g = tlCtx, W = c.width = c.clientWidth || 900, H = c.height = 20;
  const n = run.frames.length;
  for (let i = 0; i < W; i++) {
    const f = run.frames[Math.min(n - 1, i / W * n | 0)];
    g.fillStyle = ICOLOR[f.intent_applied] || '#555';
    g.fillRect(i, 0, 1, 12);
  }
  const tMax = run.frames[n - 1].t_s || 1;
  for (const w2 of (run.sceneJ?.windows || [])) {
    g.fillStyle = w2.name === 'baseline' ? '#ffffff22' : '#7fff7f22';
    g.fillRect(w2.t_s[0] / tMax * W, 0, (w2.t_s[1] - w2.t_s[0]) / tMax * W, H);
  }
  for (const e of (run.events || [])) {
    g.fillStyle = EV_COLOR[e.kind] || '#fff';
    g.fillRect(e.t_s / tMax * W - 1, 12, 2, 8);
  }
  g.fillStyle = '#fff'; g.fillRect(fi / n * W - 1, 0, 2, H);
}
function toast(msg, ms = 2200) {
  const t2 = $('toast'); t2.textContent = msg; t2.style.display = 'block';
  clearTimeout(t2._h); t2._h = setTimeout(() => t2.style.display = 'none', ms);
}
function evlistShow(uptoT) {
  const evs = (run.events || []).filter(e => e.t_s <= uptoT).slice(-6).reverse();
  $('evlist').innerHTML = evs.map(e =>
    `<div><span style="color:${EV_COLOR[e.kind] || '#fff'}">■</span> ${e.t_s.toFixed(1)}s ${e.kind}${e.target ? '→' + e.target : ''}</div>`
  ).join('') || '—';
}

function loadRun(data, label) {
  run = { frames: data.frames, events: data.events, sceneJ: data.scene, meta: data.meta, label };
  F = buildWorld(data.scene);
  trailPos.length = 0; fi = 0; playing = true; $('play').textContent = '⏸';
  resetStimuli();
  $('scene').textContent = label;
  $('meta1').textContent = `${data.meta.policy} · ${data.meta.brain} · ${data.meta.coupling} · seed ${data.meta.seed}`;
  $('src').textContent = data.meta.state_source || '';
  updateHUD(true); evlistShow(0);
}
async function fetchRun(dir) {
  const r = await fetch('/api/run?dir=' + encodeURIComponent(dir));
  if (!r.ok) throw new Error(await r.text());
  loadRun(await r.json(), dir.split('/').slice(-3).join('/'));
}

/* ---------- live 仿真 ---------- */
async function goLive() {
  const q = new URLSearchParams({ scene: $('lvScene').value, policy: $('lvPolicy').value,
    brain: $('lvBrain').value, seed: $('lvSeed').value, seconds: $('lvSec').value,
    state_source: 'observable' });
  const sceneJ = await (await fetch('/api/scene?id=' + $('lvScene').value)).json()
    .catch(() => null);
  run = { frames: [], events: [], sceneJ, meta: { policy: $('lvPolicy').value, brain: $('lvBrain').value,
    coupling: 'sensory_only', seed: +$('lvSeed').value, state_source: 'observable' },
    label: `LIVE ${$('lvScene').value}/${$('lvPolicy').value}#${$('lvSeed').value}` };
  F = buildWorld(sceneJ); trailPos.length = 0; fi = 0; playing = true; live = true;
  $('scene').textContent = run.label;
  $('meta1').textContent = `${run.meta.policy} · ${run.meta.brain} · ${run.meta.coupling} · seed ${run.meta.seed}`;
  toast('仿真启动…');
  $('lvGo').disabled = true;
  try {
    const resp = await fetch('/api/live?' + q);
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        if (!line.trim()) continue;
        const d = JSON.parse(line);
        if (d._done) {
          if (d.returncode === 0) toast('完成 ✓ run 落盘 ' + d.run_dir, 4000);
          else toast('runner 退出码 ' + d.returncode + ': ' + (d.log_tail || '').slice(-160), 6000);
          live = false;
          continue;
        }
        if (d.type === 'meta') { run.meta = { ...run.meta, ...d }; continue; }
        run.frames.push(d);
        fi = run.frames.length - 1;
        // 事件即时应用
        if (d.intent_applied) { /* frame */ }
      }
      // events.jsonl 增量读不到(流只有 traj); stimulus 由帧时刻触发:
      applyEventsTo(run.frames.at(-1)?.t_s ?? 0);
      updateHUD(false); evlistShow(run.frames.at(-1)?.t_s ?? 0);
    }
  } catch (e) {
    toast('live 错误: ' + e.message, 5000);
  }
  $('lvGo').disabled = false; live = false;
  fi = 0; playing = true; resetStimuli(); trailPos.length = 0; updateHUD(true);
}

/* ---------- 控件 ---------- */
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸' : '▶'; };
$('spd').oninput = e => { speed = +e.target.value; $('spdv').textContent = speed + '×'; };
let view = 'side';
$('viewBtn').onclick = () => {
  view = view === 'side' ? 'top' : (view === 'top' ? 'chase' : 'side');
  $('viewBtn').textContent = view === 'side' ? '侧视' : (view === 'top' ? '俯视' : '跟随视角');
};
$('mReplay').onclick = () => {
  $('mReplay').classList.add('active'); $('mLive').classList.remove('active');
  $('runSel').style.display = ''; $('liveForm').style.display = 'none';
};
$('mLive').onclick = () => {
  $('mLive').classList.add('active'); $('mReplay').classList.remove('active');
  $('runSel').style.display = 'none'; $('liveForm').style.display = '';
};
$('lvGo').onclick = goLive;
$('tlwrap').addEventListener('pointerdown', e => {
  if (live || !run) return;
  const r = $('timeline').getBoundingClientRect();
  fi = Math.max(0, Math.min(run.frames.length - 1, (e.clientX - r.left) / r.width * run.frames.length));
  trailPos.length = 0; resetStimuli(); applyEventsTo(frameAt(fi).t); updateHUD(true); evlistShow(frameAt(fi).t);
});

/* 简易轨道控制 */
{
  const canvas = $('gl'); let drag = null;
  canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => { if (!drag) return;
    const off = camera.position.clone().sub(controls.target);
    const sph = new THREE.Spherical().setFromVector3(off);
    sph.theta -= (e.clientX - drag[0]) * 0.005;
    sph.phi = Math.max(0.05, Math.min(Math.PI - 0.05, sph.phi - (e.clientY - drag[1]) * 0.005));
    camera.position.copy(controls.target).add(off.setFromSpherical(sph));
    drag = [e.clientX, e.clientY]; });
  canvas.addEventListener('pointerup', () => drag = null);
  canvas.addEventListener('wheel', e => { e.preventDefault();
    const off = camera.position.clone().sub(controls.target)
      .multiplyScalar(Math.max(0.85, Math.min(1.18, 1 + Math.sign(e.deltaY) * 0.08)));
    if (off.length() > 15 && off.length() < 900) camera.position.copy(controls.target).add(off); }, { passive: false });
}

/* ---------- 主循环 ---------- */
const clock = new THREE.Clock();
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
renderer.setAnimationLoop(() => {
  const dt = clock.getDelta();
  if (!live && playing && run && run.frames.length) {
    fi += dt * HZ * speed;
    if (fi >= run.frames.length - 1) { fi = run.frames.length - 1; playing = false; $('play').textContent = '▶'; }
    applyEventsTo(frameAt(fi).t); updateHUD(false); evlistShow(frameAt(fi).t);
  }
  if (run && $('follow').checked) controls.target.lerp(flyG.position, 0.06);
  if (view === 'chase' && run) {
    const s = frameAt(fi);
    const yawR = s.yaw * Math.PI / 180;
    camera.position.lerp(new THREE.Vector3(s.x * 100 - 40 * Math.cos(yawR), s.z * 100 + 14, s.y * 100 + 40 * Math.sin(yawR)), 0.08);
  }
  camera.lookAt(controls.target);
  renderer.render(scene, camera);
});

/* ---------- 启动: 场景下拉 + run 索引,自动加载第一个 run ---------- */
(async () => {
  const scenes = await (await fetch('/api/scenes')).json();
  $('lvScene').innerHTML = scenes.map(s => `<option>${s.id}</option>`).join('');
  const runs = await (await fetch('/api/runs')).json();
  const prefers = runs.filter(r => r.root === 'runs_confirm');
  $('runSel').innerHTML = (prefers.length ? prefers : runs)
    .map(r => `<option value="${r.rel}">${r.root}/${r.scene}/${r.policy}/${r.seed}</option>`).join('');
  $('runSel').onchange = () => fetchRun($('runSel').value).catch(e => toast(e.message));
  const first = (prefers.length ? prefers : runs)[0];
  if (first) await fetchRun(first.rel).catch(e => toast(e.message));
})();
window.__bench = { get world() { return world; }, get run() { return run; },
  get fi() { return fi; }, set fi(v) { fi = v; } };
</script>
